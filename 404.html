<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <title>cafeジュジュ メンバーズカード</title>
    <script>
      const first = location.pathname.split("/").filter(Boolean)[0];
      const base = location.hostname.endsWith("github.io") && first ? `/${first}/` : "/";
      document.write(`<base href="${base}">`);
    </script>
    <link id="app-manifest" rel="manifest" href="manifest.json?v=0.2.36" />
    <script>
      if (location.pathname.includes("/admin")) {
        document.getElementById("app-manifest")?.setAttribute("href", "manifest-admin.json?v=0.2.36");
      }
    </script>
    <link rel="stylesheet" href="styles.css?v=0.2.36" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js?v=0.2.36"></script>
  </body>
</html>
